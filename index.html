<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tevdoski Art</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #0a0a0a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { text-align: center; padding: 40px; }
    h1 { font-size: 36px; margin-bottom: 10px; }
    p { color: #aaa; margin-bottom: 30px; }
    .btn { background: #ff0050; color: white; padding: 15px 40px; border: none; border-radius: 25px; font-size: 18px; cursor: pointer; text-decoration: none; display: inline-block; }

  </style>
</head>
<body>
  <div class="container">
    <h1>Tevdoski Art</h1>
